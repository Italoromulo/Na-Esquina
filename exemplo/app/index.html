<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Na Esquina - Encontre comida perto de você</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <!-- Container Principal Mobile -->
    <div class="mobile-container">

        <!-- Barra de Pesquisa -->
        <div class="search-header">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" placeholder="Buscar restaurantes ou pratos..." id="search-input">
                <button class="filter-btn" id="filter-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                </button>
            </div>
            <button class="location-btn" id="location-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </button>
        </div>

        <!-- Abas de Categorias -->
        <div class="categories-tabs">
            <button class="tab active" data-category="all">
                <span>🍽️</span>
                <span>Todos</span>
            </button>
            <button class="tab" data-category="burguer">
                <span>🍔</span>
                <span>Burgers</span>
            </button>
            <button class="tab" data-category="pizza">
                <span>🍕</span>
                <span>Pizzas</span>
            </button>
            <button class="tab" data-category="salgados">
                <span>🥟</span>
                <span>Salgados</span>
            </button>
            <button class="tab" data-category="doces">
                <span>🍰</span>
                <span>Doces</span>
            </button>
        </div>

        <!-- Mapa -->
        <div class="map-container" id="map-container">
            <div class="map-wrapper">
                <div class="map-background" id="map-background">
                    <!-- Marcadores serão adicionados via JS -->
                </div>
                <div class="map-overlay">
                </div>
            </div>
        </div>

        <!-- Cards de Restaurantes (Bottom Sheet) -->
        <div class="restaurants-sheet" id="restaurants-sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h3>Restaurantes Próximos</h3>
                <span class="count-badge" id="restaurants-count">12</span>
            </div>
            <div class="restaurants-list" id="restaurants-list">
                <!-- Cards inseridos via JS -->
            </div>
        </div>

        <!-- Menu de Navegação (Glassmorphism) -->
        <nav class="glass-nav">
            <a href="#" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Início</span>
            </a>
            <a href="membros.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Membros</span>
            </a>
        </nav>


    </div>

    <script src="script.js"></script>
    <script>
        // Verifica se veio da loading page
        if (!sessionStorage.getItem('loadingCompleted')) {
            // Se não veio, redireciona para loading
            window.location.href = 'loading.html';
        } else {
            // Remove a flag para próxima vez
            sessionStorage.removeItem('loadingCompleted');
        }
    </script>
</body>
</html>
